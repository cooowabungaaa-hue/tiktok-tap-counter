<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Tap Counter</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #38bdf8;
            --secondary: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f43f5e;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-image:
                radial-gradient(at 0% 0%, hsla(215, 98%, 61%, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(339, 49%, 30%, 0.15) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        input {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(to right, #0ea5e9, #6366f1);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: var(--accent);
            color: white;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.05);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #475569;
        }

        .dot.active {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        .leaderboard {
            list-style: none;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .nickname {
            font-weight: 600;
            color: var(--text-main);
        }

        .user-id {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .tap-count {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }

        .animation-pop {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
                color: var(--accent);
            }

            100% {
                transform: scale(1);
            }
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 1rem;
            object-fit: cover;
            border: 2px solid var(--primary);
        }

        .rank {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            width: 30px;
            color: var(--text-muted);
            margin-right: 0.5rem;
        }

        .rank-1 {
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
            font-size: 1.5rem;
        }

        .rank-2 {
            color: #94a3b8;
            font-size: 1.4rem;
        }

        .rank-3 {
            color: #b45309;
            font-size: 1.3rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            justify-content: flex-end;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div style="position: absolute; top: 1rem; right: 1rem;">
                <button id="quitBtn" class="btn-danger"
                    style="padding: 0.5rem 1rem; font-size: 0.8rem; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">✕
                    Quit App</button>
            </div>
            <h1>TikTok Live Tap Counter</h1>
            <p class="subtitle">Real-time user tap monitoring system (v{{ version }})</p>
        </header>

        <div id="updateBanner" class="card"
            style="display:none; border: 1px solid var(--secondary); background: rgba(99, 102, 241, 0.1);">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span>🚀 新しいバージョンが見つかりました！</span>
                <a id="updateLink" href="#" target="_blank" class="btn-primary"
                    style="text-decoration: none; font-size: 0.8rem;">ダウンロード</a>
            </div>
        </div>

        <!-- Setup Panel -->
        <section id="setupPanel" class="card">
            <h2 style="margin-bottom: 1rem; font-family: 'Outfit', sans-serif;">Setup Stream</h2>
            <div class="input-group">
                <input type="text" id="streamerId" placeholder="Enter TikTok Username (e.g. @user)" value="">
                <button id="connectBtn" class="btn-primary">Start Tracking</button>
            </div>
            <p style="font-size: 0.9rem; color: var(--text-muted);">Enter the streamer's unique ID to begin monitoring
                taps.</p>
        </section>

        <!-- Live Panel -->
        <section id="livePanel" class="card" style="display: none; border-color: var(--success);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div class="status-badge active" style="background: rgba(16, 185, 129, 0.2);">
                    <span class="dot active"></span>
                    <span id="statusText" style="color: var(--success); font-weight: bold;">Connected</span>
                </div>
                <button id="disconnectBtn" class="btn-danger">End Session</button>
            </div>
            <div style="font-size: 1.2rem; font-weight: bold; margin-bottom: 0.5rem;" id="currentStreamerName"></div>
        </section>

        <section class="card">
            <h2 style="margin-bottom: 1.5rem; font-family: 'Outfit', sans-serif;">Live Leaderboard</h2>
            <div class="controls">
                <button id="copyBtn" class="btn-primary" style="background: var(--secondary); font-size: 0.9rem;">Copy
                    to Clipboard</button>
                <button id="csvBtn" class="btn-primary" style="background: var(--success); font-size: 0.9rem;">Download
                    CSV</button>
            </div>
            <ul id="leaderboard" class="leaderboard">
                <div class="empty-state">No data yet. Connect to a stream to start counting!</div>
            </ul>
        </section>
    </div>

    <script>
        const socket = io();
        const streamerIdInput = document.getElementById('streamerId');
        const connectBtn = document.getElementById('connectBtn');
        const copyBtn = document.getElementById('copyBtn');
        const quitBtn = document.getElementById('quitBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const setupPanel = document.getElementById('setupPanel');
        const livePanel = document.getElementById('livePanel');
        const currentStreamerName = document.getElementById('currentStreamerName');
        // Old elements mapping
        const statusText = document.getElementById('statusText');

        let userTable = {};

        connectBtn.addEventListener('click', () => {
            const id = streamerIdInput.value.trim().replace('@', ''); // Auto remove @
            if (id) {
                socket.emit('connect_streamer', { unique_id: id });
                connectBtn.disabled = true;
                connectBtn.innerText = 'Connecting...';
            }
        });

        disconnectBtn.addEventListener('click', () => {
            socket.emit('disconnect_streamer');
        });

        csvBtn.addEventListener('click', () => {
            window.location.href = '/export_csv';
        });

        copyBtn.addEventListener('click', () => {
            const items = Array.from(leaderboard.querySelectorAll('.leaderboard-item'));
            if (items.length === 0) return;

            let text = "Rank\tUser\tCount\n";
            items.forEach((item, index) => {
                const name = item.querySelector('.nickname').innerText;
                const count = item.querySelector('.tap-count').innerText;
                text += `${index + 1}\t${name}\t${count}\n`;
            });

            navigator.clipboard.writeText(text).then(() => {
                const originalText = copyBtn.innerText;
                copyBtn.innerText = 'Copied!';
                setTimeout(() => copyBtn.innerText = originalText, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        });

        quitBtn.addEventListener('click', async () => {
            if (confirm('Are you sure you want to close the application?')) {
                try {
                    await fetch('/shutdown', { method: 'POST' });
                    document.body.innerHTML = `
                        <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; text-align:center;">
                            <h1 style="color:var(--text-main);">App Closed</h1>
                            <p style="color:var(--text-muted);">You can safely close this tab now.</p>
                        </div>
                    `;
                } catch (e) {
                    alert('Error shutting down: ' + e);
                }
            }
        });

        socket.on('update_available', (data) => {
            const banner = document.getElementById('updateBanner');
            const link = document.getElementById('updateLink');
            banner.style.display = 'block';
            if (data.url) link.href = data.url;
        });

        socket.on('status', (data) => {
            if (data.connected) {
                // Show Live Panel
                setupPanel.style.display = 'none';
                livePanel.style.display = 'block';

                statusText.innerText = 'LIVE TRACKING';
                currentStreamerName.innerText = `Connected to: @${data.streamer}`;

                // Reset setup button just in case
                connectBtn.disabled = false;
                connectBtn.innerText = 'Start Tracking';
            } else {
                // Show Setup Panel
                setupPanel.style.display = 'block';
                livePanel.style.display = 'none';

                connectBtn.disabled = false;
                connectBtn.innerText = 'Start Tracking';

                // Clear leaderboard on disconnect
                leaderboard.innerHTML = '<div class="empty-state">No data yet. Connect to a stream to start counting!</div>';
            }
        });

        socket.on('initial_data', (data) => {
            // Rehydrate leaderboard
            if (Object.keys(data).length > 0) {
                leaderboard.innerHTML = ''; // Clear empty state
                // Convert to array
                const items = Object.entries(data).map(([uid, val]) => ({
                    user_id: uid,
                    ...val
                }));

                // Sort
                items.sort((a, b) => b.count - a.count);

                // Render
                items.forEach(user => {
                    updateOrAddUser(user.user_id, user.nickname, user.count, user.avatar);
                });

                updateRanks();
            }
        });

        socket.on('tap_update', (data) => {
            const { user_id, nickname, total_count, avatar } = data;

            if (leaderboard.querySelector('.empty-state')) {
                leaderboard.innerHTML = '';
            }

            updateOrAddUser(user_id, nickname, total_count, avatar);

            // Re-order leaderboard
            sortLeaderboard();
            updateRanks();
        });

        socket.on('error', (data) => {
            alert(`Error: ${data.message}`);
            connectBtn.disabled = false;
            connectBtn.innerText = 'Connect';
        });

        function updateOrAddUser(user_id, nickname, count, avatarUrl) {
            let item = document.getElementById(`user-${user_id}`);
            if (!item) {
                item = document.createElement('li');
                item.id = `user-${user_id}`;
                item.className = 'leaderboard-item';

                // Default avatar placeholder (Base64 SVG)
                const defaultAvatar = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/%3E%3C/svg%3E";
                const avatarSrc = avatarUrl || defaultAvatar;

                item.innerHTML = `
                    <div style="display:flex; align-items:center;">
                        <span class="rank">-</span>
                        <img src="${avatarSrc}" class="avatar" alt="avatar" onerror="this.src='${defaultAvatar}'">
                        <div class="user-info">
                            <span class="nickname">${nickname}</span>
                            <span class="user-id">ID: ${user_id}</span>
                        </div>
                    </div>
                    <div class="tap-count">0</div>
                `;
                leaderboard.appendChild(item);
            }

            // Update Avatar if changed (and not default)
            if (avatarUrl) {
                const img = item.querySelector('.avatar');
                if (img.src !== avatarUrl) img.src = avatarUrl;
            }

            const countEl = item.querySelector('.tap-count');
            countEl.innerText = count.toLocaleString();

            // Animation
            countEl.classList.remove('animation-pop');
            void countEl.offsetWidth;
            countEl.classList.add('animation-pop');
        }

        function sortLeaderboard() {
            const items = Array.from(leaderboard.children);
            items.sort((a, b) => {
                const countA = parseInt(a.querySelector('.tap-count').innerText.replace(/,/g, ''));
                const countB = parseInt(b.querySelector('.tap-count').innerText.replace(/,/g, ''));
                return countB - countA;
            });
            items.forEach(item => leaderboard.appendChild(item));
        }

        function updateRanks() {
            const items = Array.from(leaderboard.querySelectorAll('.leaderboard-item'));
            items.forEach((item, index) => {
                const rankEl = item.querySelector('.rank');
                const rank = index + 1;
                rankEl.innerText = `#${rank}`;

                // Cleanup old classes
                rankEl.classList.remove('rank-1', 'rank-2', 'rank-3');
                if (rank <= 3) rankEl.classList.add(`rank-${rank}`);
            });
        }
    </script>
</body>

</html>
